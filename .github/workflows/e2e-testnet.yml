name: E2E BOT Chain Testnet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/e2e-testnet.trigger"

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run complete live escrow lifecycle
        env:
          PRIVATE_KEY: ${{ secrets.BOTCHAIN_PRIVATE_KEY }}
          AGENT_ESCROW_ADDRESS: 0x065F0c2c935BD5CA0E177ec2Be7569750ac1971F
          BOTCHAIN_RPC_URL: https://rpc.bohr.life
        run: |
          test -n "$PRIVATE_KEY" || (echo "Missing BOTCHAIN_PRIVATE_KEY" && exit 1)
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          export PRIVATE_KEY
          forge script script/E2ETestnet.s.sol:E2ETestnet \
            --rpc-url "$BOTCHAIN_RPC_URL" \
            --broadcast \
            --slow
