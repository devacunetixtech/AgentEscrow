name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-commit
      - run: forge test -vv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  testnet-e2e:
    if: contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-commit
      - name: Run live BOT Chain escrow lifecycle
        env:
          PRIVATE_KEY: ${{ secrets.BOTCHAIN_PRIVATE_KEY }}
          AGENT_ESCROW_ADDRESS: 0x065F0c2c935BD5CA0E177ec2Be7569750ac1971F
          BOTCHAIN_RPC_URL: https://rpc.bohr.life
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "Missing BOTCHAIN_PRIVATE_KEY"
            exit 1
          fi
          if [[ "$PRIVATE_KEY" != 0x* ]]; then
            PRIVATE_KEY="0x$PRIVATE_KEY"
          fi
          export PRIVATE_KEY
          forge script script/E2ETestnet.s.sol:E2ETestnet \
            --rpc-url "$BOTCHAIN_RPC_URL" \
            --broadcast \
            --slow
