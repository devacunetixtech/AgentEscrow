name: Deploy AgentEscrow to BOT Chain Testnet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/deploy-testnet.trigger"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit

      - name: Test contract
        run: forge test -vv

      - name: Deploy and verify on Blockscout
        env:
          PRIVATE_KEY: ${{ secrets.BOTCHAIN_PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          BOTCHAIN_RPC_URL: https://rpc.bohr.life
          BOTCHAIN_VERIFIER_URL: https://scan.bohr.life/api/
        run: |
          test -n "$PRIVATE_KEY" || (echo "Missing BOTCHAIN_PRIVATE_KEY repository secret" && exit 1)
          test -n "$BLOCKSCOUT_API_KEY" || (echo "Missing BLOCKSCOUT_API_KEY repository secret" && exit 1)
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          export PRIVATE_KEY

          forge script script/DeployBotchain.s.sol:DeployBotchain \
            --rpc-url "$BOTCHAIN_RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$BOTCHAIN_VERIFIER_URL" \
            --etherscan-api-key "$BLOCKSCOUT_API_KEY" \
            --slow

      - name: Capture deployment
        id: deployment
        run: |
          FILE="broadcast/DeployBotchain.s.sol/968/run-latest.json"
          ADDRESS=$(jq -r '.transactions[] | select(.contractName == "AgentEscrow" and .transactionType == "CREATE") | .contractAddress' "$FILE" | head -n1)
          TX_HASH=$(jq -r '.transactions[] | select(.contractName == "AgentEscrow" and .transactionType == "CREATE") | .hash' "$FILE" | head -n1)
          test -n "$ADDRESS" && test "$ADDRESS" != "null" || (echo "Contract address not found" && exit 1)
          echo "address=$ADDRESS" >> "$GITHUB_OUTPUT"
          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"

      - name: Run complete live escrow lifecycle
        env:
          PRIVATE_KEY: ${{ secrets.BOTCHAIN_PRIVATE_KEY }}
          AGENT_ESCROW_ADDRESS: ${{ steps.deployment.outputs.address }}
          BOTCHAIN_RPC_URL: https://rpc.bohr.life
        run: |
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          export PRIVATE_KEY

          forge script script/E2ETestnet.s.sol:E2ETestnet \
            --rpc-url "$BOTCHAIN_RPC_URL" \
            --broadcast \
            --slow

      - name: Deployment summary
        env:
          ADDRESS: ${{ steps.deployment.outputs.address }}
          TX_HASH: ${{ steps.deployment.outputs.tx_hash }}
        run: |
          echo "### BOT Chain Testnet Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract: `$ADDRESS`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Transaction: `$TX_HASH`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explorer: https://scan.bohr.life/address/$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Blockscout: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live E2E lifecycle: passed" >> "$GITHUB_STEP_SUMMARY"
